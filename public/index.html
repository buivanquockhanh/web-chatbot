<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAFE NET 4A — Trợ lý AI KHKT</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f4f8; margin: 0; display: flex; justify-content: center; height: 100vh; }
    .container { width: 100%; max-width: 720px; background: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { background: #1e3a8a; color: #fff; padding: 16px 20px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .upload-bar { background: #e0e7ff; padding: 10px 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; border-bottom: 1px solid #c7d2fe; flex-wrap: wrap; }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .bot { align-self: flex-start; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
    .input-area { display: flex; padding: 14px; border-top: 1px solid #e2e8f0; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    button { background: #2563eb; color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    .katex-display { margin: 8px 0; overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span>🛡️ SAFE NET 4A — Chatbot AI</span>
      <span style="font-size: 12px; font-weight: normal;">Dự án KHKT</span>
    </div>

    <div class="upload-bar">
      <label for="fileInput" style="cursor:pointer; font-weight:600; color:#1e3a8a;">📎 Tải tài liệu lên (PDF, DOCX, TXT):</label>
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt" />
      <span id="fileStatus" style="color:#059669; font-weight:500;"></span>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Tôi có thể giúp gì cho bạn?</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script>
    var extractedText = "";
    var uploadedFileName = "";
    var chatHistory = [];

    function injectCss(url) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = url;
      document.head.appendChild(l);
    }

    function injectScript(url) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = url;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    var katexBase = "https" + "://" + "cdn.jsdelivr.net/npm/katex@0.16.11/dist/";
    injectCss(katexBase + "katex.min.css");
    injectScript(katexBase + "katex.min.js").then(function() {
      return injectScript(katexBase + "contrib/auto-render.min.js");
    }).catch(function(e) { console.error("Lỗi tải KaTeX:", e); });

    async function ensurePdfLib() {
      if (typeof window.pdfjsLib !== 'undefined') return window.pdfjsLib;
      var sources = [
        {
          lib: "https" + "://" + "cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
          worker: "https" + "://" + "cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"
        },
        {
          lib: "https" + "://" + "://unpkg.com",
          worker: "https" + "://" + "://unpkg.com"
        }
      ];
      for (var i = 0; i < sources.length; i++) {
        try {
          await injectScript(sources[i].lib);
          if (typeof window.pdfjsLib !== 'undefined') {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = sources[i].worker;
            return window.pdfjsLib;
          }
        } catch (e) {}
      }
      throw new Error("Không thể tải thư viện đọc PDF.");
    }

    async function ensureMammothLib() {
      if (typeof window.mammoth !== 'undefined') return window.mammoth;
      var urls = [
        "https" + "://" + "cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
        "https" + "://" + "://unpkg.com"
      ];
      for (var i = 0; i < urls.length; i++) {
        try {
          await injectScript(urls[i]);
          if (typeof window.mammoth !== 'undefined') return window.mammoth;
        } catch (e) {}
      }
      throw new Error("Không thể tải thư viện đọc file Word.");
    }

    ensurePdfLib().catch(function() {});
    ensureMammothLib().catch(function() {});

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      var file = e.target.files.item(0);
      if (!file) return;
      var status = document.getElementById('fileStatus');
      status.style.color = "#059669";
      status.textContent = "Đang đọc file...";
      uploadedFileName = file.name;
      extractedText = "";

      try {
        var lowerName = file.name.toLowerCase();
        if (lowerName.endsWith('.txt')) {
          extractedText = await file.text();
        } else if (lowerName.endsWith('.pdf')) {
          var pdfLib = await ensurePdfLib();
          var arrayBuffer = await file.arrayBuffer();
          var pdf = await pdfLib.getDocument({ data: arrayBuffer }).promise;
          var fullText = "";
          for (var i = 1; i <= pdf.numPages; i++) {
            var page = await pdf.getPage(i);
            var content = await page.getTextContent();
            fullText += content.items.map(function(item) { return item.str; }).join(" ") + "\n";
          }
          extractedText = fullText.trim();
        } else if (lowerName.endsWith('.docx')) {
          var mammothLib = await ensureMammothLib();
          var arrayBuffer = await file.arrayBuffer();
          var result = await mammothLib.extractRawText({ arrayBuffer: arrayBuffer });
          extractedText = result.value.trim();
        }

        if (!extractedText) {
          status.style.color = "#d97706";
          status.textContent = "⚠️ File rỗng hoặc là file PDF dạng ảnh scan";
        } else {
          status.style.color = "#059669";
          status.textContent = "✅ Đã nạp (" + extractedText.length + " ký tự)";
        }
      } catch (err) {
        status.style.color = "#dc2626";
        status.textContent = "❌ Lỗi: " + err.message;
        console.error(err);
      }
    });

    function appendMessage(text, sender) {
      var box = document.getElementById('chatBox');
      var div = document.createElement('div');
      div.className = "msg " + sender;
      div.textContent = text;
      box.appendChild(div);

      if (sender === 'bot' && typeof window.renderMathInElement === 'function') {
        window.renderMathInElement(div, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }

      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      var input = document.getElementById('userInput');
      var btn = document.getElementById('sendBtn');
      var message = input.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      input.value = '';
      btn.disabled = true;

      try {
        var res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            history: chatHistory,
            fileName: uploadedFileName,
            fileContent: extractedText
          })
        });

        var rawText = await res.text();
        var data;
        try {
          data = JSON.parse(rawText);
        } catch (parseErr) {
          appendMessage("Lỗi từ máy chủ Vercel (Mã " + res.status + "): Kiểm tra lại file api/chat.js trên GitHub.", 'bot');
          return;
        }

        var reply = data.reply || data.error || "Không nhận được phản hồi.";
        appendMessage(reply, 'bot');

        if (data.reply) {
          chatHistory.push({ role: 'user', text: message });
          chatHistory.push({ role: 'model', text: reply });
        }
      } catch (err) {
        appendMessage("Lỗi kết nối mạng tới máy chủ: " + err.message, 'bot');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
